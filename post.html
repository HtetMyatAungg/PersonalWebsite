<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Redirect stub. Posts used to be rendered by this one page from a query
         string (post.html?p=<slug>); they are now real pages at
         /writing/<slug>/, generated by scripts/build-posts.mjs. Kept because
         those query URLs have been shared and indexed.

         This stub needs a script rather than just a meta refresh: the slug is in
         the query, so the target cannot be written as a static URL.
         encodeURIComponent is not decoration — this interpolates an
         attacker-controllable parameter into a path, and it stops a hand-edited
         ?p=../../something escaping /writing/. -->
    <title>Moved to /writing/ — Htet Myat Aung</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://htetmyataung.uk/writing/">
    <meta http-equiv="refresh" content="1; url=/writing/">
    <script>
        (function () {
            var slug = new URLSearchParams(location.search).get("p");
            location.replace(slug
                ? "/writing/" + encodeURIComponent(slug) + "/" + location.hash
                : "/writing/");
        })();
    </script>
</head>
<body>
    <p>Posts now live under <a href="/writing/">/writing/</a>.</p>
</body>
</html>
