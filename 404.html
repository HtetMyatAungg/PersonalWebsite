<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — Htet Myat Aung</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/assets/media/icon.png">

    <!-- Legacy URLs. GitHub Pages serves this file for any path that does not
         exist, so old links (on CVs already sent out, in search results) are
         forwarded from here instead of keeping a stub file per URL. The site is
         one page now, so everything lands on it. Add a line to `moved` whenever
         a URL changes. Runs before paint. -->
    <script>
        (function () {
            var moved = {
                "/about": "/", "/contact": "/#hire", "/blog": "/", "/post": "/", "/writing": "/",
                "/research": "/#work", "/experience": "/#work", "/projects": "/#projects"
            };
            var path = location.pathname.replace(/\/index\.html$|\.html$|\/$/, "");
            var to = moved[path] || (/^\/(writing|content)\//.test(path) ? "/" : null);
            if (to) location.replace(to.indexOf("#") < 0 ? to + location.hash : to);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Inter:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap">

</head>
