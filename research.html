<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Redirect stub. This page now lives at /research/ — a folder with an
         index.html inside, which every static server resolves, Live Server
         included. Kept because this URL is on CVs already sent out and in
         search results.

         The script is the real redirect: it carries ?query and #hash across,
         which a bare meta refresh drops. The refresh is the no-JS fallback, and
         it waits 1s rather than 0s so it cannot win a race against the script
         and silently lose the query string. location.replace, not .href, so the
         stub never lands in session history and Back does not bounce forward. -->
    <title>Moved to /research/ — Htet Myat Aung</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://htetmyataung.uk/research/">
    <meta http-equiv="refresh" content="1; url=/research/">
    <script>location.replace("/research/" + location.search + location.hash);</script>
</head>
<body>
    <p>This page is now at <a href="/research/">/research/</a>.</p>
</body>
</html>
