name: Rebuild post manifest and pages

# Keeps content/posts.json AND the writing/<slug>/ pages in sync with the
# Markdown files.
#
# This exists so you can add a post from anywhere — including GitHub's web
# editor on a phone — without running anything locally. Commit a .md file and
# both the manifest and the post's page appear a few seconds later.
#
# Both outputs stay committed to the repo: GitHub Pages serves the repository
# as-is, so the site itself never depends on this workflow having run.

on:
  push:
    branches: [main]
    paths:
      - "content/posts/**.md"
      - "scripts/build-posts.mjs"
      - "assets/js/modules/frontmatter.js"
      - "assets/js/modules/markdown.js"
      # The page template reads site data from config.js, so a change there
      # (the domain, the name in every <title>) makes every page stale.
      - "assets/js/config.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-manifest
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Fails the run if a post is missing required frontmatter, so a broken
      # post is caught here rather than showing up empty on the live site.
      - name: Rebuild manifest and post pages
        run: node scripts/build-posts.mjs

      # `git add -A` first, then check the INDEX rather than the worktree.
      # `git diff --quiet` cannot see a brand-new untracked file, so checking
      # before staging would silently skip the commit for the first post added
      # from the web editor — the page would be generated and never pushed.
      # -A also stages the deletions that pruning produces.
      - name: Commit if it changed
        run: |
          git add -A content/posts.json writing
          if git diff --cached --quiet; then
            echo "Manifest and post pages already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild post manifest and pages [skip ci]"
          git push
